# Build the app and run the fast tests. The four-language drill verifiers that
# `make verify` also runs are deliberately left out: they take minutes and need
# python3 and elixir as well. Run those locally before touching drill content.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Gleam is pinned to the same version as the Makefile and the
      # server/Dockerfile base image: the browser runtime vendored under
      # assets/gleam-runtime is that compiler, built to wasm.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.18.1"
          # Some transitive Erlang dependencies (hpack, glisten) build with it.
          rebar3-version: "3"
          # `make content` runs drills/elixir/surface.exs before generating
          # the embedded drills, so the build needs Elixir as well. Same pin
          # as the server job below.
          elixir-version: "1.18"

      # Pinned, because `make worker` minifies the three worker bundles with
      # whatever bun is on PATH and the output differs between bun versions.
      # So that what is tested here and what deploy/web.Dockerfile ships are
      # the same bytes. Kept in step with the local toolchain and with the
      # image by `make check-versions`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      # That same version is pinned in a dozen places by hand. Checked first
      # because everything below builds against whatever it says.
      - name: Version pins agree
        run: make check-versions

      # The real integration check: regenerates the embedded drill content,
      # bundles the three workers, then builds the app.
      - name: Build
        run: make build

      # `dist/` is not committed -- the web image builds it -- so there is
      # nothing to check for staleness there. The embedded drill modules ARE
      # committed, and `make build` above ran `make content`, which regenerates
      # them. A diff here means the commit carries generated content its own
      # generator would not produce.
      - name: Generated drill content is current
        run: |
          if ! git diff --quiet -- src/gleamdrill/problems/; then
            echo "::error::generated content is stale. Run 'make content' and commit the result."
            git diff --stat -- src/gleamdrill/problems/
            exit 1
          fi

      # Runs after the build because `make content` formats what it generates.
      - name: Formatting
        run: make check-format

      # The scheduler is shared by the server and the app, so it is tested on
      # both targets. Identical results are what licenses sharing one module.
      - name: Scheduler tests
        run: make fsrs-test

      # The wire format is shared the same way. Every payload round-trips
      # through its own encoder and decoder, on both targets.
      - name: Wire format tests
        run: make wire-test

      # The app's decoders against captured server responses.
      - name: App tests
        run: make app-test

  # Nothing here ran in CI before: the backend was never so much as
  # type-checked. It holds every account and enforces the grading rule, so it
  # gets its own job with a real database behind it.
  server:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gleamdrill
          POSTGRES_PASSWORD: gleamdrill
          POSTGRES_DB: gleamdrill_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gleamdrill -d gleamdrill_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://gleamdrill:gleamdrill@127.0.0.1:5432/gleamdrill_ci
      # CI-only, and the server refuses to boot on anything shorter than 64.
      SECRET_KEY_BASE: github-actions-ci-secret-key-base-not-a-real-secret-000000000000000000
      ALLOWED_ORIGIN: http://localhost:1234
      PORT: "1637"
      BIND: 127.0.0.1

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.18.1"
          rebar3-version: "3"
          # Argon2 comes from `antigone` -> `comeonin`, which is an Elixir
          # package, so building the server needs an Elixir toolchain. This is
          # why server/Dockerfile uses the `-elixir` image rather than plain
          # Gleam; the same requirement applies here.
          elixir-version: "1.18"

      # Go drills run on the server too (server/priv/run-go); the exec tests
      # compile and run a few attempts for real.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          # No module dependencies, so there is no go.sum to key a cache on.
          cache: false

      # An attempt's build shares the standard library cache; cold, that
      # first compile alone outlasts the attempt's clock and the exec tests
      # report a timeout. Warm it once, with the flags priv/run-go sets so
      # the cache keys match (server/Dockerfile does the same for the image).
      - name: Warm the Go build cache
        run: CGO_ENABLED=0 go build std

      # Haskell drills run on the server too (server/priv/run-haskell). The
      # distro ghc is installed explicitly rather than trusting whatever the
      # runner image's ghcup happens to carry.
      - name: Install GHC
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghc

      # Like Go's cache warm above: the first ghc invocation pays for paging
      # in the package db and the linker, which on a cold runner costs more
      # than an attempt's clock — the first exec test then reports a timeout.
      # One throwaway compile makes every later one take under a second.
      - name: Warm ghc
        run: |
          ghc --version
          printf 'import qualified Data.Map.Strict as M\nimport qualified Data.Set as S\nmain :: IO ()\nmain = print (M.size (M.empty :: M.Map Int Int) + S.size (S.empty :: S.Set Int))\n' > /tmp/warm.hs
          ghc -v0 -O0 -o /tmp/warm /tmp/warm.hs && /tmp/warm

      # The app half of the tree is not built here, but `server` path-depends
      # on ../fsrs, which is why the whole repo is checked out.
      - name: Build
        run: cd server && gleam build

      - name: Unit tests
        run: make server-test

      # Migrations run on boot, so starting the server is itself the migration
      # test. Backgrounded, then waited on rather than slept.
      - name: Start server
        run: |
          cd server && gleam run > /tmp/server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:1637/health > /dev/null; then
              echo "server up"; exit 0
            fi
            sleep 1
          done
          echo "::error::server did not come up"
          cat /tmp/server.log
          exit 1

      # 95 checks against the real HTTP surface: status codes, JSON shapes,
      # CORS, the auth boundary.
      - name: Smoke tests
        run: make server-smoke

      - name: Server log
        if: failure()
        run: cat /tmp/server.log || echo "(the server never started)"

  # Both images, from the repository root, which is the context Railway uses.
  # Until this existed a Dockerfile change was unverifiable until production
  # tried it: adding the `wire` package to server/gleam.toml without adding it
  # to .dockerignore and server/Dockerfile broke four consecutive api deploys
  # while every other check stayed green, because `gleam build` runs against a
  # checkout where the package is simply there.
  #
  # The web image compiles the bundle rather than copying a committed one, so
  # this is also the only check that its builder stage and the .dockerignore
  # allow-list are complete.
  #
  # Its own job, on its own runner, rather than the tail of `server`: Hex
  # rate-limits per address, and as the last step of a job that had already
  # resolved the server's dependencies twice, the web image's resolution was
  # the one that kept getting a 429 (October 2026, five red runs in a row).
  # The web image no longer resolves at all (tools/gleam-path-fingerprints.mjs);
  # the retry below is the backstop, and only ever fires on Hex's 429.
  images:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Images build
        run: |
          set -o pipefail
          build() {
            for attempt in 1 2 3; do
              if docker build "$@" 2>&1 | tee /tmp/build.log; then return 0; fi
              grep -q "rate limit for the Hex API" /tmp/build.log || return 1
              [ "$attempt" -lt 3 ] || return 1
              echo "::warning::Hex rate limit; retrying in $((attempt * 60))s"
              sleep $((attempt * 60))
            done
          }
          build -f server/Dockerfile -t gleamdrill-api-ci .
          build -f deploy/web.Dockerfile -t gleamdrill-web-ci .
