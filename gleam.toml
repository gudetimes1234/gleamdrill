name = "algodrill"
version = "2.0.0"
target = "javascript"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
plinth = ">= 0.10.2 and < 1.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_javascript = ">= 1.0.1 and < 2.0.0"
gleam_time = ">= 1.10.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
rsvp = ">= 2.0.0 and < 3.0.0"

# The FSRS scheduler, shared verbatim with the backend. The app uses it to
# preview what each grading button would do; the server uses the same code to
# decide it for real. See ../fsrs.
fsrs = { path = "fsrs" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
simplifile = ">= 2.0.0 and < 3.0.0"
lustre_dev_tools = ">= 2.3.6 and < 3.0.0"

[tools.lustre.build]
minify = true

[tools.lustre.html]
title = "AlgoDrill - NeetCode Practice"
stylesheets = [{ href = "/style.css" }]

# lustre_dev_tools folds each table here into <meta>/<link> attributes verbatim,
# so the head is configured from here rather than from an HTML template.
# Everything referenced lives in assets/, which is copied wholesale into dist/.
#
# There is deliberately no `algodrill-api` meta tag: the app defaults to its own
# origin and reaches the backend through the reverse proxy in deploy/Caddyfile,
# so nothing about where it is deployed is baked into the artifact. Add the tag
# back only for a split-origin deployment. See src/algodrill/ffi.mjs apiBase().

[[tools.lustre.html.meta]]
name = "description"
content = "Spaced-repetition drilling for algorithm problems, with in-browser checking in Python, Gleam and TypeScript."

# Tints the browser chrome on mobile to match the app background.
[[tools.lustre.html.meta]]
name = "theme-color"
content = "#1a1b26"

[[tools.lustre.html.meta]]
name = "color-scheme"
content = "dark"

[[tools.lustre.html.links]]
rel = "icon"
type = "image/svg+xml"
href = "/favicon.svg"

[[tools.lustre.html.links]]
rel = "manifest"
href = "/manifest.webmanifest"
